# =============================================================================
# LiteLLM proxy: laya decides which worker serves each request.
#
#   client -> :4000 model=laya-router -> decider rewrites model -> worker
#
# The virtual model `laya-router` exists only to be intercepted. The callback in
# decider.py asks laya which worker fits, rewrites `model`, and LiteLLM
# dispatches, retries, falls back and attributes cost as it would for any
# direct call.
#
#   PYTHONPATH=. litellm --config LLM_config.yaml --port 4000
#
# Before reaching for this at all, read the note at the bottom: LiteLLM has
# shipped auto-routing with a built-in JEV classifier, and it may already do
# what this file is arranging by hand.
# =============================================================================

model_list:
  # DeepSeek (hosted, OpenAI-compatible at api.deepseek.com). The two tiers are
  # the only hosted workers: one cheap, one capable. `reasoning_effort` rides
  # in extra_body so it is forwarded verbatim, matching the ECA provider config.
  - model_name: deepseek-flash        # fast/cheap, 256K context
    litellm_params:
      model: openai/deepseek-flash
      base_url: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      extra_body:
        reasoning_effort: medium

  - model_name: deepseek-v4-pro       # harder work, 256K context
    litellm_params:
      model: openai/deepseek-v4-pro
      base_url: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
      extra_body:
        reasoning_effort: medium

  # Self-hosted llama.cpp on the laptop, one OpenAI-compatible server serving
  # the GGUF checkpoints configured in ~/.config/eca/config.json. These are the
  # only workers that may see data which must not leave the building.
  - model_name: minicpm5-local        # 2B, 128K context -- the cheap local
    litellm_params:
      model: openai/MiniCPM5-2B-Q4_K_M.gguf
      base_url: http://127.0.0.1:9080/v1
      api_key: none

  - model_name: bonsai-local          # 9B ternary, 96K context -- mid local
    litellm_params:
      model: openai/Ternary-Bonsai-2-9B-PQ2_0-MTP-Q8_0.gguf
      base_url: http://127.0.0.1:9080/v1
      api_key: none

  - model_name: ornith-local          # 35B, 64K context -- the large local
    litellm_params:
      model: openai/Ornith-1.5-35B-Q4_K_M.gguf
      base_url: http://127.0.0.1:9080/v1
      api_key: none

  # RunPod, the rented GPU. Off-premises but a dedicated instance rather than a
  # hosted API, so it stays in the self-hosted fallback group. The pod proxy URL
  # changes when the pod is recreated -- keep it in sync with the ECA config.
  - model_name: runpod                # Qwen3.8-Flash-Next, 240K context
    litellm_params:
      model: openai/Qwen3.8-Flash-Next-UD-Q2_K_XL
      base_url: https://xh22rnllkuq2so-8080.proxy.runpod.net/v1
      api_key: os.environ/RUNPOD_API_KEY

  # The virtual model clients ask for. The callback in decider.py intercepts it
  # and rewrites `model` to laya's choice, so these params are only reached if
  # that callback fails to load. They point at laya itself -- not at a worker --
  # because an un-intercepted request must fail closed, not silently leave the
  # building for a hosted model. Note laya only serves /v1/systemone, so this
  # fallback will not answer a chat completion; that is deliberate.
  - model_name: laya-router
    litellm_params:
      model: openai/laya
      base_url: http://localhost:8000/v1
      api_key: none

litellm_settings:
  # This is the supported way to reach a request from a YAML-configured proxy:
  # module path, then the instance within it.
  #
  # There is no `pre_call_hooks` key inside a model_list entry. An unknown key
  # there is not rejected, it is passed through to the provider call and
  # ignored, so a hook configured that way silently never runs.
  callbacks: ["decider.proxy_handler_instance"]

router_settings:
  # Applied after the decision, so a worker chosen for a request too long for
  # its context window is escalated rather than refused.
  enable_pre_call_checks: true
  num_retries: 2
  fallbacks:
    - deepseek-v4-pro: ["deepseek-flash"]
    # A local worker must NOT fall back to a hosted API. The whole reason a
    # request was routed local is that its contents may not leave the building,
    # and a silent failover would send it anyway. RunPod is a dedicated rented
    # instance, so it is the only acceptable fallback for a local route; the
    # other local checkpoints are tried when RunPod itself is down.
    - ornith-local: ["runpod"]
    - bonsai-local: ["runpod"]
    - minicpm5-local: ["runpod"]
    - runpod: ["minicpm5-local"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# =============================================================================
# Consider before keeping any of this
#
# LiteLLM shipped Auto Routing in v1.94.x, and one of its classifier backends
# is JEV itself. If hosted TypeSafe Jev is acceptable, the whole of decider.py
# collapses into config:
#
#   - model_name: smart-router
#     litellm_params:
#       model: auto_router/complexity_router
#       complexity_router_config:
#         tiers:
#           SIMPLE:    deepseek-flash
#           MEDIUM:    deepseek-flash
#           COMPLEX:   deepseek-v4-pro
#           REASONING: deepseek-v4-pro
#     complexity_router_default_model: deepseek-flash
#
# Reasons to keep the hook anyway, all of them about control rather than
# capability:
#
#   - The tiers are complexity. "This contains customer data, keep it local" is
#     not a point on that scale, and both local routes above are exactly that
#     kind of decision.
#   - Its tiers are models. They cannot express "laya answers this itself and
#     no LLM is called", which is the largest cost saving available here.
#   - Auto Routing is beta, and its own docs say the config keys may change.
#   - Self-hosted laya keeps the routing decision -- which sees every
#     request -- inside your own network.
# =============================================================================
